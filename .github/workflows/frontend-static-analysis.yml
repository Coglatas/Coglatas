name: Frontend Static Analysis

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/frontend-static-analysis.yml"
      - "package.json"
      - "package-lock.json"
      - "frontend/**"
      - "tests/**/*.ts"
      - "*.ts"
      - "tools/frontend-inspections/**"
      - "scripts/ci/configure-persistent-caches.sh"
      - "scripts/ci/npm-ci-retry.sh"
  push:
    branches:
      - main

concurrency:
  group: frontend-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-static-analysis:
    name: frontend-static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Configure persistent npm cache
        shell: bash
        run: bash scripts/ci/configure-persistent-caches.sh

      - name: Install repository JavaScript dependencies
        shell: bash
        run: |
          npm ci --prefer-offline --ignore-scripts --no-audit --no-fund
          npm --prefix frontend ci --prefer-offline --ignore-scripts --no-audit --no-fund

      - name: Install locked frontend inspection toolchain
        shell: bash
        run: bash scripts/ci/npm-ci-retry.sh tools/frontend-inspections

      - name: Enforce ESLint and Stylelint findings
        shell: bash
        run: npm run lint:frontend:enforce

      - name: Upload frontend inspection reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-static-analysis-reports
          path: artifacts/frontend-inspections
          if-no-files-found: warn
          retention-days: 14
