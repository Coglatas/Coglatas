name: Qodana Deep Analysis

# Qodana policy execution is intentionally kept out of this PR-mutable caller.
# The reusable gate is pinned to an immutable commit so an external PR cannot
# edit or remove its restore, scan, or SARIF-guard steps.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/qodana_code_quality.yml"
      - ".github/workflows/qodana_trusted_gate.yml"
      - ".editorconfig"
      - "qodana.yaml"
      - "global.json"
      - "Coglatas.slnx"
      - "Directory.Build.*"
      - "Directory.Packages.*"
      - "NuGet.config"
      - "src/**"
      - "tests/Coglatas.Tests/**"
      - "scripts/quality/**"
      - "scripts/ci/configure-persistent-caches.sh"
      - "scripts/ci/cleanup-qodana-containers.sh"
  push:
    branches:
      - main
  # Scheduled trigger temporarily disabled on 2026-09-19 to reduce CI consumption.
  # schedule:
  #   - cron: "17 18 * * 0"

concurrency:
  group: qodana-deep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana-dotnet-community:
    name: Qodana Gate
    permissions:
      contents: read
    uses: NYGsatoshi/Coglatas/.github/workflows/qodana_trusted_gate.yml@e03555c4be3700aa23f6e0bfe86b740b042dd5fa # qodana-debt-ratchet-v2
