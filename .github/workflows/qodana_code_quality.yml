name: Qodana Deep Analysis

# Owner/name-independent trusted scan. The caller only runs on the stable
# repository identity and on main, so the local reusable workflow is resolved
# from the same trusted main commit before and after repository transfer.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Scheduled trigger temporarily disabled on 2026-09-19 to reduce CI consumption.
  # schedule:
  #   - cron: "17 18 * * 0"

concurrency:
  group: qodana-deep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana-dotnet-community:
    name: Qodana Gate
    if: ${{ github.repository_id == '1261244608' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: $/.github/workflows/qodana_trusted_gate.yml
