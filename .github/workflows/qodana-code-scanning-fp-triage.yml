name: Qodana Code Scanning false-positive triage

on:
  push:
    branches:
      - ops/qodana-code-scanning-triage-20261002
    paths:
      - .github/workflows/qodana-code-scanning-fp-triage.yml
      - scripts/quality/qodana-reviewed-alerts.json

concurrency:
  group: qodana-fp-triage
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  security-events: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Export current alerts and previous execution evidence without mutations
        id: inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import collections
          import datetime
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qodana-fp-evidence'
          out.mkdir()
          headers = {'Accept': 'application/vnd.github+json',
                     'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'X-GitHub-Api-Version': '2022-11-28',
                     'User-Agent': 'Coglatas-Qodana-Evidence-Review'}

          def get(path):
              req = urllib.request.Request(api + '/repos/' + repo + path, headers=headers)
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)

          source_sha = get('/git/ref/heads/main')['object']['sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('source_sha=' + source_sha + '\n')
          summary = {'source_sha': source_sha, 'repository': repo,
                     'run_id': os.environ['GITHUB_RUN_ID'],
                     'captured_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'mode': 'READ_ONLY', 'states': {}}
          for state in ('open', 'dismissed'):
              alerts = []
              for page in range(1, 101):
                  query = urllib.parse.urlencode({'state': state, 'ref': 'refs/heads/main',
                                                  'per_page': 100, 'page': page})
                  batch = get('/code-scanning/alerts?' + query)
                  alerts.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise RuntimeError('Alert pagination limit exceeded')
              (out / ('alerts-' + state + '.json')).write_text(json.dumps(alerts, ensure_ascii=False), encoding='utf-8')
              summary['states'][state] = {'count': len(alerts),
                  'tools': dict(collections.Counter(a['tool']['name'] for a in alerts)),
                  'rules': dict(collections.Counter(a['rule']['id'] for a in alerts)),
                  'previous_automated_triage': sum((a.get('dismissed_comment') or '').startswith(
                      'Automated Qodana false-positive triage on 2026-10-02.') for a in alerts)}

          previous_run = get('/actions/runs/36988308931')
          summary['previous_run'] = {k: previous_run.get(k) for k in (
              'id', 'status', 'conclusion', 'head_sha', 'html_url', 'run_attempt', 'updated_at')}
          req = urllib.request.Request(api + '/repos/' + repo + '/actions/jobs/110778325917/logs', headers=headers)
          with urllib.request.urlopen(req, timeout=90) as response:
              log = response.read().decode('utf-8', errors='replace')
          lines = [line for line in log.splitlines() if '\x1b' not in line and re.search(
              r'(?:Z )(?:Dismissed:|High-confidence false-positive candidates:|Open code-scanning alerts:|Candidate breakdown:|FAILED #)', line)]
          (out / 'previous-run-summary.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          summary['main_unchanged_during_export'] = get('/git/ref/heads/main')['object']['sha'] == source_sha
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          print('\n'.join(lines[-10:]))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Read-only Qodana evidence inventory\n\n```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY

      - name: Checkout the exact reviewed source revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.inventory.outputs.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Package tracked first-party review sources without running application code
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tarfile
          root = pathlib.Path('source')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qodana-fp-evidence'
          names = subprocess.check_output(['git', '-C', str(root), 'ls-files', '-z']).decode().split('\0')
          selected = []
          for name in names:
              if not name or '/Migrations/' in name or '/wwwroot/' in name or '/node_modules/' in name:
                  continue
              path = pathlib.PurePosixPath(name)
              if (name.startswith(('src/', 'tests/Coglatas.Tests/', 'tests/Coglatas.ArchitectureTests/', 'frontend/src/'))
                      and path.suffix in {'.cs', '.csproj', '.json', '.ts', '.html', '.props', '.targets'}):
                  selected.append(name)
          with tarfile.open(out / 'review-sources.tar.gz', 'w:gz') as archive:
              for name in selected:
                  p = root / name
                  if p.is_file() and not p.is_symlink():
                      archive.add(p, arcname=name, recursive=False)
          print('Packaged tracked first-party files:', len(selected))
          PY

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qodana-fp-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/qodana-fp-evidence/
          if-no-files-found: error
          retention-days: 14
