name: Qodana Code Scanning false-positive triage

on:
  push:
    branches:
      - ops/qodana-code-scanning-triage-20261002
    paths:
      - .github/workflows/qodana-code-scanning-fp-triage.yml
      - scripts/quality/apply-qodana-full-audit-20261002.py
      - scripts/quality/apply-reviewed-qodana-alerts.py
      - scripts/quality/qodana-reviewed-alerts.json

concurrency:
  group: qodana-fp-triage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    outputs:
      source_sha: ${{ steps.inventory.outputs.source_sha }}
    steps:
      - name: Export all current alert states without mutations
        id: inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import collections
          import datetime
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qodana-fp-inventory'
          out.mkdir()
          headers = {'Accept': 'application/vnd.github+json',
                     'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'X-GitHub-Api-Version': '2022-11-28',
                     'User-Agent': 'Coglatas-Qodana-Evidence-Review'}
          def get(path):
              req = urllib.request.Request(api + '/repos/' + repo + path, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          source_sha = get('/git/ref/heads/main')['object']['sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('source_sha=' + source_sha + '\n')
          summary = {'source_sha': source_sha, 'repository': repo,
                     'run_id': os.environ['GITHUB_RUN_ID'],
                     'captured_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'mode': 'READ_ONLY_FULL_AUDIT_INVENTORY', 'states': {}}
          for state in ('open', 'dismissed', 'fixed'):
              alerts = []
              for page in range(1, 101):
                  query = urllib.parse.urlencode({'state': state, 'ref': 'refs/heads/main',
                                                  'per_page': 100, 'page': page})
                  batch = get('/code-scanning/alerts?' + query)
                  alerts.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise RuntimeError('Alert pagination limit exceeded')
              (out / ('alerts-' + state + '.json')).write_text(json.dumps(alerts, ensure_ascii=False), encoding='utf-8')
              summary['states'][state] = {'count': len(alerts),
                  'tools': dict(collections.Counter(a['tool']['name'] for a in alerts)),
                  'rules': dict(collections.Counter(a['rule']['id'] for a in alerts)),
                  'analysis_revisions': dict(collections.Counter(a['most_recent_instance']['commit_sha'] for a in alerts))}
          summary['main_unchanged_during_export'] = get('/git/ref/heads/main')['object']['sha'] == source_sha
          (out / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          if not summary['main_unchanged_during_export']:
              raise RuntimeError('Main changed during export')
          PY
      - name: Upload immutable before-inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qodana-full-audit-before-${{ github.run_id }}
          path: ${{ runner.temp }}/qodana-fp-inventory/
          if-no-files-found: error
          retention-days: 14

  apply-reviewed:
    if: ${{ github.event.head_commit.message == 'ops: apply full Qodana audit 20261002 (28 dismissals, 13 reopenings)' }}
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout the exact source revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.inventory.outputs.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout immutable approvals and the previously reviewed applier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: review
          persist-credentials: false
          fetch-depth: 1
      - name: Validate all 41 identities and 24 source hashes then verify each correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 review/scripts/quality/apply-qodana-full-audit-20261002.py \
            source "$RUNNER_TEMP/qodana-full-audit-receipt"
      - name: Preserve exact approval code and reviewed evidence files without executing application code
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import tarfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qodana-full-audit-receipt'
          out.mkdir(exist_ok=True)
          root = pathlib.Path('source').resolve()
          plan = out / 'approved-full-audit-manifest.json'
          if plan.exists():
              manifest = json.loads(plan.read_text())
              actual = {}
              with tarfile.open(out / 'reviewed-source-files.tar.gz', 'w:gz') as archive:
                  for name in manifest['source_sha256']:
                      path = (root / name).resolve()
                      if not path.is_relative_to(root) or not path.is_file():
                          raise RuntimeError('Invalid evidence path')
                      actual[name] = hashlib.sha256(path.read_bytes()).hexdigest()
                      archive.add(path, arcname=name, recursive=False)
              (out / 'actual-source-sha256.json').write_text(json.dumps(actual, indent=2))
          for name in ('apply-qodana-full-audit-20261002.py', 'apply-reviewed-qodana-alerts.py'):
              path = pathlib.Path('review/scripts/quality') / name
              if path.is_file():
                  shutil.copyfile(path, out / (name + '.txt'))
          PY
      - name: Upload verified full-audit correction receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qodana-full-audit-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/qodana-full-audit-receipt/
          if-no-files-found: error
          retention-days: 14
