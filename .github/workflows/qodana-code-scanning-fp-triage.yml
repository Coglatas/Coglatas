name: Qodana Code Scanning false-positive triage

on:
  push:
    branches:
      - ops/qodana-code-scanning-triage-20261002
    paths:
      - .github/workflows/qodana-code-scanning-fp-triage.yml
      - scripts/quality/qodana-reviewed-alerts.json
      - scripts/quality/apply-reviewed-qodana-alerts.py
      - scripts/quality/QodanaAuditIndexer.cs

concurrency:
  group: qodana-fp-triage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Export current alerts without mutations
        id: inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import collections
          import datetime
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qodana-fp-evidence'
          out.mkdir()
          headers = {'Accept': 'application/vnd.github+json',
                     'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'X-GitHub-Api-Version': '2022-11-28',
                     'User-Agent': 'Coglatas-Qodana-Evidence-Review'}
          def get(path):
              req = urllib.request.Request(api + '/repos/' + repo + path, headers=headers)
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)
          source_sha = get('/git/ref/heads/main')['object']['sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('source_sha=' + source_sha + '\n')
          summary = {'source_sha': source_sha, 'repository': repo,
                     'run_id': os.environ['GITHUB_RUN_ID'],
                     'captured_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'mode': 'READ_ONLY_FULL_REAUDIT', 'states': {}}
          for state in ('open', 'dismissed', 'fixed'):
              alerts = []
              for page in range(1, 101):
                  query = urllib.parse.urlencode({'state': state, 'ref': 'refs/heads/main',
                                                  'per_page': 100, 'page': page})
                  batch = get('/code-scanning/alerts?' + query)
                  alerts.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise RuntimeError('Alert pagination limit exceeded')
              (out / ('alerts-' + state + '.json')).write_text(json.dumps(alerts, ensure_ascii=False), encoding='utf-8')
              summary['states'][state] = {'count': len(alerts),
                  'tools': dict(collections.Counter(a['tool']['name'] for a in alerts)),
                  'rules': dict(collections.Counter(a['rule']['id'] for a in alerts)),
                  'analysis_revisions': dict(collections.Counter(a['most_recent_instance']['commit_sha'] for a in alerts))}
          summary['main_unchanged_during_export'] = get('/git/ref/heads/main')['object']['sha'] == source_sha
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          if not summary['main_unchanged_during_export']:
              raise RuntimeError('Main changed during export; do not use mixed evidence')
          PY

      - name: Checkout the exact source revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.inventory.outputs.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout the immutable review tooling without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: review
          persist-credentials: false
          fetch-depth: 1

      - name: Index source with SDK Roslyn without building or executing the application
        shell: bash
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/qodana-roslyn.XXXXXX")"
          cp review/scripts/quality/QodanaAuditIndexer.cs "$work/Program.cs"
          cp review/scripts/quality/QodanaAuditIndexer.cs "$RUNNER_TEMP/qodana-fp-evidence/Indexer.cs.txt"
          cd "$work"
          major="$(dotnet --version | cut -d. -f1)"
          cat > NuGet.Config <<'XML'
          <configuration><packageSources><clear /></packageSources></configuration>
          XML
          cat > AuditIndexer.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>FRAMEWORK</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <FrameworkReference Include="Microsoft.AspNetCore.App" />
              <Reference Include="Microsoft.CodeAnalysis"><HintPath>$(MSBuildSDKsPath)/../Roslyn/bincore/Microsoft.CodeAnalysis.dll</HintPath></Reference>
              <Reference Include="Microsoft.CodeAnalysis.CSharp"><HintPath>$(MSBuildSDKsPath)/../Roslyn/bincore/Microsoft.CodeAnalysis.CSharp.dll</HintPath></Reference>
            </ItemGroup>
          </Project>
          XML
          sed -i "s/FRAMEWORK/net${major}.0/" AuditIndexer.csproj
          dotnet run --project AuditIndexer.csproj -- "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/qodana-fp-evidence"

      - name: Package tracked first-party sources without running application code
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tarfile
          root = pathlib.Path('source')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qodana-fp-evidence'
          names = subprocess.check_output(['git', '-C', str(root), 'ls-files', '-z']).decode().split('\0')
          selected = []
          hashes = {}
          for name in names:
              if not name or '/wwwroot/' in name or '/node_modules/' in name:
                  continue
              path = pathlib.PurePosixPath(name)
              if (name.startswith(('src/', 'tests/', 'frontend/src/', 'scripts/quality/'))
                      and path.suffix in {'.cs', '.csproj', '.json', '.ts', '.html', '.props', '.targets', '.py', '.xml'}
                      or '/' not in name and path.suffix in {'.json', '.props', '.targets', '.editorconfig', '.yml', '.yaml', '.DotSettings', '.sln', '.slnx'}
                      or name == '.editorconfig'):
                  p = root / name
                  if p.is_file() and not p.is_symlink():
                      selected.append(name)
                      hashes[name] = hashlib.sha256(p.read_bytes()).hexdigest()
          with tarfile.open(out / 'review-sources.tar.gz', 'w:gz') as archive:
              for name in selected:
                  archive.add(root / name, arcname=name, recursive=False)
          (out / 'source-file-sha256.json').write_text(json.dumps(hashes, indent=2))
          print('Packaged tracked first-party files:', len(selected))
          PY

      - name: Upload full re-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qodana-fp-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/qodana-fp-evidence/
          if-no-files-found: error
          retention-days: 14
