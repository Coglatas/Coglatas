name: Qodana Packet Verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qodana-packet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  packet-proof:
    name: Qodana packet baseline and candidate
    if: startsWith(github.head_ref, 'qodana/packet-')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coglatas_ci
          POSTGRES_USER: coglatas_ci
          POSTGRES_PASSWORD: coglatas_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coglatas_ci -d coglatas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASPNETCORE_ENVIRONMENT: Test
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "1"
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=coglatas_ci;Username=coglatas_ci;Password=coglatas_ci_password
      POSTGRES_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=coglatas_ci;Username=coglatas_ci;Password=coglatas_ci_password
      PGPASSWORD: coglatas_ci_password
      PACKET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Test packet evidence verifier
        run: python3 -m unittest discover -s scripts/ci/qodana-packets -p 'test_*.py' -v

      - name: Run unchanged baseline before approved candidate
        run: python3 scripts/ci/qodana-packets/verify.py

      - name: Preserve baseline and candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qodana-packet-proof-${{ github.event.pull_request.head.sha }}
          path: artifacts/qodana-packet-proof/
          if-no-files-found: error
          retention-days: 14
