name: Human Merge Approval

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# This workflow is intentionally permissionless. Its only purpose is to request
# approval from the protected GitHub Environment named below.
permissions: {}

concurrency:
  group: human-merge-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  human-approval:
    name: Human Merge Approval
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    environment:
      name: human-merge-approval

    steps:
      - name: Record approved PR head
        shell: bash
        run: |
          echo "Human approval granted for PR #${{ github.event.pull_request.number }}."
          echo "Approved head SHA: ${{ github.event.pull_request.head.sha }}"
