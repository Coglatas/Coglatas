name: PostgreSQL structural performance

on:
  pull_request:
    paths:
      - ".github/workflows/performance-db.yml"
      - "src/**"
      - "tests/Coglatas.Tests/PostgreSql/PerformanceDbCaptureTests.cs"
      - "tests/ci/test_performance_db.py"
      - "performance/**"
      - "scripts/performance/**"
      - "infra/compose/performance/**"
      - "global.json"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "performance/**"
      - "scripts/performance/**"
      - "infra/compose/performance/**"
      - ".github/workflows/performance-db.yml"
  schedule:
    - cron: "41 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  collect:
    name: DB evidence (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [small, medium]
    env:
      COGLATAS_PERFORMANCE_PROFILE: ${{ matrix.profile }}
      COGLATAS_PERFORMANCE_RUNTIME_MODE: source
      COGLATAS_PERFORMANCE_PORT: "18080"
      COGLATAS_PERFORMANCE_DB_CAPTURE_ENABLED: "true"
      COGLATAS_PERFORMANCE_COMPOSE_PROJECT: coglatas-performance-db-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test fail-closed DB evidence validator
        run: python3 -m unittest discover -s tests/ci -p 'test_performance_db.py'

      - name: Generate synthetic fixture credential
        shell: bash
        run: |
          password="$(python3 -c 'import secrets; print("PerfCi-" + secrets.token_urlsafe(24))')"
          echo "::add-mask::$password"
          echo "COGLATAS_PERFORMANCE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Collect warmed Release API query evidence on PostgreSQL 18
        shell: bash
        run: |
          bash scripts/performance/with-environment.sh \
            python3 scripts/performance/db-probe.py \
            --profile "$COGLATAS_PERFORMANCE_PROFILE" \
            --output "artifacts/performance/$COGLATAS_PERFORMANCE_PROFILE/db.json"

      - name: Upload safe structural and duration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf05-${{ matrix.profile }}
          path: |
            artifacts/performance/${{ matrix.profile }}/db.json
            artifacts/performance/${{ matrix.profile }}/environment.json
            artifacts/performance/${{ matrix.profile }}/fixture.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: PostgreSQL query regression gate
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require both dataset collectors
        env:
          COLLECT_RESULT: ${{ needs.collect.result }}
        run: test "$COLLECT_RESULT" = "success"

      - name: Download both dataset artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perf05-*
          path: artifacts/perf05

      - name: Block structural regressions and record PERF-03 duration results
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            args+=(--duration)
          fi
          python3 scripts/performance/db-compare.py \
            --small artifacts/perf05/perf05-small/db.json \
            --medium artifacts/perf05/perf05-medium/db.json \
            --output artifacts/perf05/results/structural.json \
            "${args[@]}"

      - name: Upload DB gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf05-results
          path: artifacts/perf05/results/
          if-no-files-found: error
          retention-days: 14
