name: ReSharper PR Analysis

on:
  pull_request:
    branches:
      - main

concurrency:
  group: resharper-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resharper-inspectcode:
    name: ReSharper InspectCode / PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      RESHARPER_VERSION: "2026.2.2"

    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Classify pull-request analysis scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/resharper"
          changed_files="$report_dir/changed-files.nul"
          projects_file="$report_dir/projects.txt"
          restore_targets="$report_dir/restore-targets.txt"
          mkdir -p "$report_dir"

          git diff --name-only --diff-filter=ACMRT -z "$BASE_SHA...HEAD" > "$changed_files"

          CHANGED_FILES_PATH="$changed_files" \
          PROJECTS_FILE="$projects_file" \
          RESTORE_TARGETS_FILE="$restore_targets" \
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          changed_path = Path(os.environ["CHANGED_FILES_PATH"])
          projects_path = Path(os.environ["PROJECTS_FILE"])
          restore_targets_path = Path(os.environ["RESTORE_TARGETS_FILE"])

          paths = [
              item.decode("utf-8", errors="surrogateescape").replace("\\", "/")
              for item in changed_path.read_bytes().split(b"\0")
              if item
          ]

          self_test_paths = {
              ".github/workflows/resharper_pr.yml",
              "scripts/quality/check-resharper-pr-sarif.py",
          }
          global_names = {
              ".editorconfig",
              "global.json",
              "nuget.config",
              "directory.build.props",
              "directory.build.targets",
              "directory.packages.props",
          }

          def is_global_input(path: str) -> bool:
              p = Path(path)
              lower = path.lower()
              return (
                  path == "Coglatas.slnx"
                  or p.name.lower() in global_names
                  or lower.endswith((".props", ".targets", ".dotsettings", ".sln", ".slnx"))
              )

          def is_dotnet_input(path: str) -> bool:
              lower = path.lower()
              return (
                  lower.endswith((".cs", ".csproj", ".fsproj", ".vbproj"))
                  or is_global_input(path)
                  or path in self_test_paths
              )

          def owning_csproj(path: str) -> Path | None:
              candidate = (root / path).resolve()
              if candidate.suffix.lower() == ".csproj":
                  return candidate if candidate.is_file() else None

              directory = candidate.parent
              while directory == root or root in directory.parents:
                  matches = sorted(directory.glob("*.csproj"))
                  if len(matches) == 1:
                      return matches[0]
                  if len(matches) > 1:
                      return None
                  if directory == root:
                      break
                  directory = directory.parent
              return None

          relevant = [path for path in paths if is_dotnet_input(path)]
          needs_analysis = bool(relevant)
          full_solution = any(is_global_input(path) for path in relevant)

          selected: dict[str, Path] = {}
          if needs_analysis and not full_solution:
              for path in relevant:
                  if path in self_test_paths:
                      continue
                  project = owning_csproj(path)
                  if project is None:
                      full_solution = True
                      selected.clear()
                      break
                  selected[project.stem] = project.relative_to(root)

          # Workflow-only changes still execute a real, bounded InspectCode run.
          if needs_analysis and not full_solution and not selected:
              representative = Path("src/Coglatas.Domain/Coglatas.Domain.csproj")
              selected[representative.stem] = representative

          if full_solution:
              projects_path.write_text("", encoding="utf-8")
              restore_targets_path.write_text("Coglatas.slnx\n", encoding="utf-8")
          else:
              projects_path.write_text(
                  "".join(f"{name}\n" for name in sorted(selected)),
                  encoding="utf-8",
              )
              restore_targets_path.write_text(
                  "".join(f"{selected[name].as_posix()}\n" for name in sorted(selected)),
                  encoding="utf-8",
              )

          print(f"needs_analysis={'true' if needs_analysis else 'false'}")
          print(f"full_solution={'true' if full_solution else 'false'}")
          print(f"changed_files_path={changed_path}")
          print(f"projects_path={projects_path}")
          print(f"restore_targets_path={restore_targets_path}")
          PY

      - name: Restore selected .NET projects
        if: steps.scope.outputs.needs_analysis == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r target; do
            [[ -n "$target" ]] || continue
            echo "Restoring $target"
            dotnet restore "$target" --verbosity minimal
          done < "${{ steps.scope.outputs.restore_targets_path }}"

      - name: Install ReSharper command-line tools
        if: steps.scope.outputs.needs_analysis == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/resharper-tools"
          dotnet tool install JetBrains.ReSharper.GlobalTools \
            --version "$RESHARPER_VERSION" \
            --tool-path "$tool_dir"
          echo "RESHARPER_JB=$tool_dir/jb" >> "$GITHUB_ENV"

      - name: Run ReSharper InspectCode fast lane
        if: steps.scope.outputs.needs_analysis == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sarif="$RUNNER_TEMP/resharper/inspectcode.sarif.json"

          args=(
            inspectcode
            Coglatas.slnx
            --output="$sarif"
            --severity=WARNING
            --no-swea
            --no-build
            --no-updates
            --properties:Configuration=Release
            --properties:RunAnalyzers=false
            --verbosity=WARN
          )

          while IFS= read -r project; do
            [[ -n "$project" ]] || continue
            args+=(--project="$project")
          done < "${{ steps.scope.outputs.projects_path }}"

          echo "ReSharper scope:"
          if [[ -s "${{ steps.scope.outputs.projects_path }}" ]]; then
            cat "${{ steps.scope.outputs.projects_path }}"
          else
            echo "full solution"
          fi

          "$RESHARPER_JB" "${args[@]}"

      - name: Gate changed files on ReSharper findings
        if: steps.scope.outputs.needs_analysis == 'true'
        shell: bash
        run: |
          python3 scripts/quality/check-resharper-pr-sarif.py \
            "$RUNNER_TEMP/resharper/inspectcode.sarif.json" \
            "${{ steps.scope.outputs.changed_files_path }}"

      - name: Skip ReSharper for non-.NET pull request
        if: steps.scope.outputs.needs_analysis != 'true'
        shell: bash
        run: echo "No .NET or ReSharper configuration changes detected; fast lane is not required."

      - name: Upload ReSharper report
        if: always() && steps.scope.outputs.needs_analysis == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resharper-pr-sarif
          path: ${{ runner.temp }}/resharper/inspectcode.sarif.json
          if-no-files-found: warn
          retention-days: 7
