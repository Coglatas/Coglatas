name: Main Build Artifacts

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: main-build-artifacts-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  main-build-artifacts:
    name: Main build artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: syncfusion-licensed-build
    timeout-minutes: 90

    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
      SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      IMAGE_NAME: coglatas-main-runtime:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -n "${SYNCFUSION_LICENSE:-}"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Download authoritative .NET build from main CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-release-build
          path: ${{ runner.temp }}/main-dotnet-build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_CI_RUN_ID }}

      - name: Restore authoritative .NET build outputs
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/main-dotnet-build/dotnet-release-build.tar"
          test -f "$archive"
          tar -xf "$archive" -C "$GITHUB_WORKSPACE"

          actual="$(tr -d '\r\n' < artifacts/ci/dotnet-build-sha)"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "::error::CI .NET artifact SHA $actual does not match main revision $TARGET_SHA."
            exit 1
          fi

      - name: Restore runner-local NuGet packages
        run: dotnet restore Coglatas.slnx --disable-parallel --verbosity minimal

      - name: Publish backend from redistributed build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/main-runtime/publish
          mkdir -p artifacts/main-runtime/publish
          dotnet publish src/Coglatas.Web/Coglatas.Web.csproj             --configuration Release             --no-build             --no-restore             --output artifacts/main-runtime/publish

      - name: Use repository npm version without lifecycle scripts
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Build licensed frontend once
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run build:licensed
          test -f frontend/dist/coglatas-web/index.html
          test -f frontend/dist/coglatas-web/angular-app.marker
          ! grep -R -F -q -- "$SYNCFUSION_LICENSE" frontend/dist/coglatas-web

          rm -rf artifacts/main-runtime/frontend
          mkdir -p artifacts/main-runtime/frontend
          cp -a frontend/dist/coglatas-web/. artifacts/main-runtime/frontend/

      - name: Build production runtime image from redistributed outputs
        shell: bash
        run: |
          set -euo pipefail
          docker build             --file infra/docker/runtime-prebuilt.Dockerfile             --tag "$IMAGE_NAME"             .

          docker run --rm --entrypoint sh "$IMAGE_NAME" -c '
            test -s /app/Coglatas.Web.dll &&
            test -s /app/wwwroot/index.html &&
            test ! -e /run/secrets &&
            test ! -e /app/.env &&
            ! env | grep -q "^SYNCFUSION_LICENSE="
          '

      - name: Package main runtime and .NET artifacts
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/main-build-artifacts"
          rm -rf "$out"
          mkdir -p "$out"

          printf '%s\n' "$TARGET_SHA" > "$out/source-sha"
          printf '%s\n' "$IMAGE_NAME" > "$out/runtime-image-name"
          cp "$RUNNER_TEMP/main-dotnet-build/dotnet-release-build.tar" "$out/dotnet-release-build.tar"

          docker save "$IMAGE_NAME" | gzip -1 > "$out/runtime-image.tar.gz"

          ls -lh "$out"

      - name: Upload main build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-build-artifacts
          path: ${{ runner.temp }}/main-build-artifacts
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove per-run runtime image
        if: always()
        run: docker image rm --force "$IMAGE_NAME" || true


  performance-environment:
    name: Performance from main artifacts
    needs: main-build-artifacts
    uses: ./.github/workflows/performance-environment.yml
    with:
      target_sha: ${{ github.event.workflow_run.head_sha }}
      profile: small

  licensed-real-backend:
    name: Real-backend E2E from main artifacts
    needs: main-build-artifacts
    uses: ./.github/workflows/licensed-real-backend-acceptance.yml
    with:
      target_sha: ${{ github.event.workflow_run.head_sha }}
      suite: all

  sbom-image-security:
    name: SBOM image scan from main artifacts
    needs: main-build-artifacts
    uses: ./.github/workflows/sbom-image-security.yml
    with:
      target_sha: ${{ github.event.workflow_run.head_sha }}
