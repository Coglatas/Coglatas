version: "1.0"

# Qodana Community for .NET analyzes first-party C#/ASP.NET Core source and tests.
linter: qodana-cdnet

# Start from JetBrains' recommended profile, then additionally enable every
# inspection whose default IDE severity is ERROR, WARNING, or WEAK WARNING.
# This is intentionally strict without enabling low-value TYPO/INFO-only rules.
profile:
  base:
    name: qodana.recommended
  groups:
    - groupId: StrictDefaultSeverities
      groups:
        - "severity:ERROR"
        - "severity:WARNING"
        - "severity:WEAK WARNING"
  inspections:
    - group: StrictDefaultSeverities
      enabled: true
    # Keep repository-wide duplication detection explicit even if JetBrains
    # changes the recommended/default severity profile in a future release.
    - inspection: DuplicatedCode
      enabled: true
    # Also catch repeated statement sequences inside C# control-flow branches.
    - inspection: DuplicatedStatements
      enabled: true
    # These integration tests intentionally bind Kestrel to an ephemeral port and
    # create clients whose BaseAddress and cookie state belong to that single app.
    # Sharing HttpClient instances across tests would cross those isolation boundaries.
    - inspection: ShortLivedHttpClient
      ignore:
        - "tests/Coglatas.Tests/Auth/HttpSecurityPolicyTests.cs"
        - "tests/Coglatas.Tests/Auth/Sec13ProductionHttpTests.cs"
        - "tests/Coglatas.Tests/Auth/SecurityHeadersMiddlewareTests.cs"
        - "tests/Coglatas.Tests/Web/AngularSpaFallbackTests.cs"

# Prepare the complete .NET project model before inspections start.
bootstrap: bash scripts/quality/qodana-bootstrap.sh

# Keep local and CI analysis on the same canonical solution/configuration.
dotnet:
  solution: Coglatas.slnx
  configuration: Release

exclude:
  - name: All
    paths:
      - "bin"
      - "obj"
      - "node_modules"
      - "dist"
      - ".angular"
      - ".tmp"
      - ".qodana"
      - "artifacts"
      - "**/bin/**"
      - "**/obj/**"
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/.angular/**"
      - "**/coverage/**"
      - "**/TestResults/**"
      - "**/test-results/**"
      - "**/playwright-report/**"
      - "**/.playwright/**"
      - "**/.qodana/**"
      - "**/storybook-static/**"
      - "**/artifacts/**"
      - "src/Coglatas.Application/bin"
      - "src/Coglatas.Application/obj"
      - "src/Coglatas.Domain/bin"
      - "src/Coglatas.Domain/obj"
      - "src/Coglatas.Infrastructure/bin"
      - "src/Coglatas.Infrastructure/obj"
      - "src/Coglatas.Web/bin"
      - "src/Coglatas.Web/obj"
      - "tests/Coglatas.Tests/bin"
      - "tests/Coglatas.Tests/obj"
      - "frontend/node_modules"
      - "frontend/dist"
      - "frontend/.angular"
      - "src/Coglatas.Web/wwwroot"
      - "src/Coglatas.Web/data"
      - "coglatas-frontend"
